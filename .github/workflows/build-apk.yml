name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Force fix project structure
        run: |
          mkdir -p src
          if [ -f "src/main.rs" ]; then mv src/main.rs src/lib.rs; fi
          if [ -f "src/mine.rs" ]; then mv src/mine.rs src/lib.rs; fi
          if [ -f "main.rs" ]; then mv main.rs src/lib.rs; fi
          if [ -f "mine.rs" ]; then mv mine.rs src/lib.rs; fi
          
          cat > Cargo.toml <<EOF
          [package]
          name = "rust_messenger"
          version = "2.2.0"
          edition = "2021"
          autobins = false

          [lib]
          name = "rust_messenger"
          crate-type = ["cdylib"]
          path = "src/lib.rs"
          EOF
          echo "✅ Структура исправлена"

      - name: Setup Rust with Cache
        uses: Swatinem/rust-cache@v2
        with:
          targets: aarch64-linux-android
          cache-on-failure: true

      - name: Setup Rust Target
        run: rustup target add aarch64-linux-android

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Manual Android SDK Setup
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline.zip
          unzip -o -q cmdline.zip
          mv cmdline-tools latest
          cd $ANDROID_HOME
          wget -q https://dl.google.com/android/repository/platform-tools-latest-linux.zip
          unzip -o -q platform-tools-latest-linux.zip
          mkdir -p build-tools
          wget -q https://dl.google.com/android/repository/build-tools_r33-linux.zip
          unzip -o -q build-tools_r33-linux.zip -d build-tools
          mv build-tools/* build-tools/33.0.0 || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Rust binary
        run: |
          cargo ndk -t arm64-v8a -o ./android/app/src/main/jniLibs build --release

      - name: Generate Android project
        run: |
          PKG_ID="com.example.rustmessenger"
          PKG_PATH="com/example/rustmessenger"
          APP_NAME="RustMessenger"

          mkdir -p android/app/src/main/java/$PKG_PATH
          mkdir -p android/app/src/main/assets
          mkdir -p android/app/src/main/jniLibs

          cat > android/settings.gradle <<EOF
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "$APP_NAME"
          include ':app'
          EOF

          cat > android/build.gradle <<EOF
          plugins {
              id 'com.android.application' version '8.1.4' apply false
          }
          EOF

          cat > android/gradle.properties <<EOF
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          EOF

          cat > android/app/build.gradle <<EOF
          plugins { id 'com.android.application' }
          android {
              namespace '$PKG_ID'
              compileSdk 33
              defaultConfig {
                  applicationId "$PKG_ID"
                  minSdk 24
                  targetSdk 33
                  versionCode 1
                  versionName "1.0.0"
                  ndk { abiFilters 'arm64-v8a' }
              }
              buildTypes { release { minifyEnabled false } }
          }
          EOF

          cat > android/app/src/main/AndroidManifest.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application android:label="$APP_NAME" android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # --- НОВЫЙ ИНТЕРФЕЙС JAVA ---
          cat > android/app/src/main/java/$PKG_PATH/MainActivity.java <<'JAVA'
          package com.example.rustmessenger;

          import android.app.Activity;
          import android.os.Bundle;
          import android.widget.*;
          import android.view.View;
          import java.io.*;

          public class MainActivity extends Activity {
              static { System.loadLibrary("rust_messenger"); }

              public native void init_rust();
              public native void start_server(int port);
              public native void connect_to_server(String ip, int port);
              public native void send_message(String msg);
              public native void set_callback(Callback cb);

              public interface Callback { void onMessage(String msg); }

              private LinearLayout layoutStart, layoutChat;
              private TextView chatOutput;
              private ScrollView chatScroll;
              private EditText inputMessage;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  init_rust();
                  set_callback(msg -> runOnUiThread(() -> appendChat(msg)));

                  layoutStart = new LinearLayout(this);
                  layoutStart.setOrientation(LinearLayout.VERTICAL);
                  layoutStart.setPadding(30, 100, 30, 30);
                  layoutStart.setGravity(android.view.Gravity.CENTER_HORIZONTAL);

                  TextView title = new TextView(this);
                  title.setText("Rust Messenger");
                  title.setTextSize(28);
                  layoutStart.addView(title);

                  Button btnServer = new Button(this);
                  btnServer.setText("Создать сервер (Порт 8080)");
                  btnServer.setOnClickListener(v -> {
                      start_server(8080);
                      showChat();
                  });
                  layoutStart.addView(btnServer);

                  EditText ipInput = new EditText(this);
                  ipInput.setHint("IP сервера (например, 192.168.1.5)");
                  layoutStart.addView(ipInput);

                  Button btnClient = new Button(this);
                  btnClient.setText("Подключиться");
                  btnClient.setOnClickListener(v -> {
                      String ip = ipInput.getText().toString();
                      if (!ip.isEmpty()) {
                          connect_to_server(ip, 8080);
                          showChat();
                      }
                  });
                  layoutStart.addView(btnClient);

                  layoutChat = new LinearLayout(this);
                  layoutChat.setOrientation(LinearLayout.VERTICAL);

                  chatOutput = new TextView(this);
                  chatOutput.setTextSize(16);
                  chatOutput.setPadding(20, 20, 20, 20);

                  chatScroll = new ScrollView(this);
                  chatScroll.addView(chatOutput);
                  chatScroll.setLayoutParams(new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, 0, 1f));

                  inputMessage = new EditText(this);
                  inputMessage.setHint("Введи сообщение...");
                  inputMessage.setSingleLine(true);

                  Button btnSend = new Button(this);
                  btnSend.setText("Отправить");
                  btnSend.setOnClickListener(v -> sendChat());

                  LinearLayout bottomBar = new LinearLayout(this);
                  bottomBar.setOrientation(LinearLayout.HORIZONTAL);
                  bottomBar.addView(inputMessage, new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f));
                  bottomBar.addView(btnSend);

                  layoutChat.addView(chatScroll);
                  layoutChat.addView(bottomBar);

                  setContentView(layoutStart);
              }

              private void sendChat() {
                  String text = inputMessage.getText().toString();
                  if (!text.isEmpty()) {
                  send_message(text);
                  appendChat("Вы: " + text);
                  inputMessage.setText("");
              }
              }

              private void appendChat(String msg) {
                  chatOutput.append(msg + "\n");
                  chatScroll.post(() -> chatScroll.fullScroll(ScrollView.FOCUS_DOWN));
              }

              private void showChat() {
                  runOnUiThread(() -> setContentView(layoutChat));
              }
          }
          JAVA

          cp target/aarch64-linux-android/release/librust_messenger.so android/app/src/main/jniLibs/arm64-v8a/ 2>/dev/null || true

      - name: Download Gradle 8.2
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle-8.2-bin.zip
          echo "$PWD/gradle-8.2/bin" >> $GITHUB_PATH

      - name: Setup Gradle Wrapper
        run: |
          cd android
          gradle wrapper --gradle-version 8.2 --quiet
          chmod +x gradlew

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RustMessenger-APK
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
